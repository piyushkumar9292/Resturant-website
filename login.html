<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIYUSH WORLD LOGIN</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#0d1117;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  overflow:hidden;
  position:relative;
}

/* Floating background animation */
body::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background:radial-gradient(circle,#f59e0b33,transparent 40%);
  animation:moveBg 10s linear infinite;
  z-index:-1;
}
@keyframes moveBg{
  0%{transform:translate(-25%,-25%)}
  50%{transform:translate(-35%,-35%)}
  100%{transform:translate(-25%,-25%)}
}

/* BACK BUTTON */
#back{
  position:fixed;
  top:20px;
  left:20px;
  z-index:10;
}
.back{
  background-color:#5dfc6b;
  height:35px;
  width:90px;
  border-radius:6px;
  font-weight:700;
  border:none;
  cursor:pointer;
  font-size:14px;
}
.back:hover{
  opacity:0.9;
}

/* Login container */
.login-container{
  position:relative;
  background:#111827;
  padding:40px;
  width:380px;
  border-radius:12px;
  box-shadow:0 0 25px rgba(0,0,0,0.5);
  animation:fadeIn 1s ease;
  z-index:1;
}

@keyframes fadeIn{
  0%{opacity:0; transform:translateY(40px);}
  100%{opacity:1; transform:translateY(0);}
}

/* Title */
.login-title{
  font-size:30px;
  font-weight:900;
  text-align:center;
  margin-bottom:25px;
  background:linear-gradient(90deg,#5dfc6b,#ffb300);
  background-clip:text;
  -webkit-background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
  animation:glow 2s infinite alternate;
}

@keyframes glow{
  from{filter:drop-shadow(0 0 5px #ffb300);}
  to{filter:drop-shadow(0 0 15px #5dfc6b);}
}

/* Inputs */
.input-group{
  margin-bottom:20px;
}
.input-group input{
  width:100%;
  padding:12px;
  border:none;
  outline:none;
  border-radius:6px;
  background:#1f2937;
  color:white;
  font-size:15px;
  transition:0.3s;
}
.input-group input:focus{
  box-shadow:0 0 10px #f59e0b;
}

/* Button */
.login-btn{
  width:100%;
  padding:12px;
  border:none;
  background:linear-gradient(90deg,#f59e0b,#e63946);
  color:white;
  font-weight:bold;
  border-radius:6px;
  cursor:pointer;
  transition:0.3s;
}
.login-btn:hover{
  transform:scale(1.05);
}

/* extra links */
.extra{
  text-align:center;
  margin-top:15px;
  font-size:14px;
  color:#ccc;
}
.extra a{
  color:#f59e0b;
  text-decoration:none;
}

/* Mobile */
@media(max-width:500px){
  .login-container{
    width:90%;
    padding:30px;
  }
  .login-title{
    font-size:24px;
  }
  .back{
    height:30px;
    width:70px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<!-- BACK BUTTON -->
<div id="back">
  <button class="back" onclick="window.location.href='index.html?skipLoader=true'">BACK</button>
</div>

<!-- LOGIN BOX -->
<div class="login-container">
  <h2 class="login-title">PIYUSH WORLD</h2>

  <form>
    <div class="input-group">
      <input type="email" placeholder="Enter Email" required>
    </div>

    <div class="input-group">
      <input type="password" placeholder="Enter Password" required>
    </div>

    <button class="login-btn">LOGIN</button>

    <div class="extra">
      <p>Forgot Password?</p>
      <p>Don't have an account? <a href="#">Sign Up</a></p>
    </div>
  </form>
</div>

</body>
</html>
